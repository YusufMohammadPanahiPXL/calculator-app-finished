name: Build Example
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout
       uses: actions/checkout@v4.4.0

     - name: Setup Node.js environment
       uses: actions/setup-node@v7.1.0

     - name: Build the code
       run: zip -r release.zip .

     - name: Install dependencies
       run: npm install

     - name: Test the code
       run: npm test

     - name: Verification
       run: ls -alhR
      
